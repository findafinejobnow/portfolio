<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本风格预览小工具 | 前端原型</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            margin-bottom: 20px;
        }
        .title-card h1 {
            text-align: center;
            font-size:26px;
            color:#1f2937;
            margin:0 0 10px;
        }
        .title-card p {
            text-align:center;
            color:#4b5563;
            font-size:14px;
            margin:0;
        }
        textarea#input-text {
            width:100%;
            min-height:140px;
            padding:14px;
            border:1px solid #d1d5db;
            border-radius:12px;
            font-size:15px;
            resize:vertical;
        }
        .row-wrap {
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            margin:16px 0;
            align-items:center;
        }
        .form-item {
            flex:1;
            min-width:220px;
        }
        label {
            display:block;
            font-size:14px;
            color:#374151;
            margin-bottom:6px;
        }
        select, input[type="range"] {
            width:100%;
            padding:9px 12px;
            border-radius:8px;
            border:1px solid #d1d5db;
            font-size:15px;
        }
        .radio-group {
            display:flex;
            gap:16px;
            margin:12px 0;
        }
        .btn-group {
            display:flex;
            gap:12px;
            margin:20px 0;
        }
        button {
            padding:10px 20px;
            border-radius:8px;
            border:none;
            font-size:15px;
            cursor:pointer;
        }
        #preview-btn {
            background-color:#6366f1;
            color:white;
        }
        #clear-btn, #copy-btn {
            background-color:#e5e7eb;
            color:#1f2937;
        }
        .result-area {
            min-height:140px;
            padding:14px;
            border:1px solid #e5e7eb;
            border-radius:12px;
            background:#f9fafb;
            margin-bottom:16px;
            white-space: pre-line;
        }
        .tag-block{
            background:#eff6ff;
            border-radius:10px;
            padding:14px;
            margin-bottom:16px;
        }
        .tag-title{
            font-weight:bold;
            color:#1e40af;
            margin-bottom:8px;
        }
        .vlog-tip{
            background:#f0fdf4;
            border-radius:10px;
            padding:12px;
            margin-bottom:16px;
            color:#166534;
            display:none;
        }
        .feedback-block{
            border:1px solid #ddd6fe;
            background:#faf5ff;
            border-radius:12px;
            padding:16px;
            margin-top:20px;
        }
        .feedback-block h4{
            margin-top:0;
            margin-bottom:10px;
            color:#5b21b6;
        }
        #feedback-text{
            width:100%;
            min-height:80px;
            border:1px solid #d8b4fe;
            border-radius:8px;
            padding:10px;
        }
        #submit-feedback{
            margin-top:10px;
            background:#8b5cf6;
            color:white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card title-card">
            <h1>文本风格预览小工具 | 前端原型</h1>
            <p>说明：本Demo为作品集静态演示版；完整AI版本本地可接入Ollama Qwen实现真实文案生成。</p>
        </div>

        <div class="card">
            <textarea id="input-text" placeholder="在这里粘贴你的自媒体文案/感悟..."></textarea>

            <div class="row-wrap">
                <div class="form-item">
                    <label>文风选择</label>
                    <select id="style-select">
                        <option value="xiaohongshu">小红书种草</option>
                        <option value="dry">干货</option>
                        <option value="vlog">Vlog口播</option>
                        <option value="vk">VK俄系社媒风格（全俄语）</option>
                        <option value="ins">Ins英文短文案风格（全英文）</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>钩子强度: <span id="hook-value">中等</span></label>
                    <input id="hook-slider" type="range" min="1" max="5" value="3">
                </div>
            </div>

            <div>
                <label>文案长度</label>
                <div class="radio-group">
                    <label><input type="radio" name="len" value="short"> 短句版</label>
                    <label><input type="radio" name="len" value="normal" checked> 常规版</label>
                    <label><input type="radio" name="len" value="long"> 加长叙事版</label>
                </div>
            </div>

            <div class="btn-group">
                <button id="preview-btn">预览风格</button>
                <button id="clear-btn">清空输入</button>
                <button id="copy-btn">复制结果</button>
            </div>

            <div class="vlog-tip" id="vlog-tip">
                💡 Vlog口播预估朗读时长：<span id="time-estimate">约1分20秒</span>
            </div>

            <div class="result-area" id="result-area">预览结果将展示在这里</div>

            <div class="tag-block" id="tag-block" style="display:none;">
                <div class="tag-title">推荐平台标签</div>
                <div id="tag-content">#自媒体 #内容创作 #AIGC</div>
            </div>

            <div class="feedback-block">
                <h4>不满意？提交修改反馈</h4>
                <p style="font-size:14px;color:#4b5563;margin:0 0 8px;">写下你的调整要求，完整版后端会记录你的偏好，下次生成自动参考</p>
                <textarea id="feedback-text" placeholder="例如：口语再强一点 / 俄语文案不要学术词汇 / 钩子冲击力不足"></textarea>
                <button id="submit-feedback">提交偏好记录</button>
            </div>
        </div>
    </div>

<script>
    const hookSlider = document.getElementById('hook-slider');
    const hookValue = document.getElementById('hook-value');
    const hookMap = {1:"很弱",2:"偏弱",3:"中等",4:"较强",5:"强钩子"};
    hookSlider.oninput = ()=>{
        hookValue.innerText = hookMap[hookSlider.value];
    }

    const styleSelect = document.getElementById('style-select');
    const vlogTip = document.getElementById('vlog-tip');
    const timeEstimate = document.getElementById('time-estimate');
    styleSelect.onchange = ()=>{
        if(styleSelect.value === 'vlog'){
            vlogTip.style.display = "block";
        }else{
            vlogTip.style.display = "none";
        }
    }

    // 模板文案生成核心函数（A版本重点）
    function generateMockText(rawInput, style, hookLevel, lenType){
        const hookPrefix = {
            1: "",
            2: "简单聊聊：",
            3: "分享一个有意思的发现：",
            4: "谁懂啊！",
            5: "救命！这个点真的戳到我！"
        }[hookLevel];

        const lenMult = {
            short: 0.5,
            normal:1,
            long:1.6
        }[lenType];

        const templates = {
            xiaohongshu: `${hookPrefix}${rawInput}

停下来回味，才发现很多瞬间值得被记录。
不必追求宏大叙事，普通日常本身就很有力量。

适合慢慢看，慢慢感受。`,
            dry: `${hookPrefix}主题：${rawInput}

核心要点
1. 提炼这件事背后的底层逻辑
2. 拆解可复用的经验，方便落地
3. 总结避坑提醒，减少试错成本

适合想系统学习的朋友。`,
            vlog: `${hookPrefix}${rawInput}

其实很多感受都是当下一瞬间冒出来的。
没有精心设计剧本，只是把真实想法讲出来。

如果你也有同样的体验，欢迎在评论区聊聊你的看法。`,
            vk: `${hookPrefix}${rawInput}

Личные размышления и впечатления.
Поделюсь опытом и мыслями.
Буду рад вашим комментариям!`,
            ins: `${hookPrefix}${rawInput}

Moments and thoughts captured in daily life.
Keep exploring and stay curious ✨`
        }
        let text = templates[style];
        // 加长版本简单重复扩充内容
        if(lenMult >1){
            text += "\n\n再多延伸一点，这件事带给我的启发，放在长期视角来看，也很有参考价值。";
        }else if(lenMult <1){
            const lines = text.split("\n").filter(line=>line.trim()!=='');
            text = lines.slice(0,2).join("\n");
        }
        return text;
    }

    const previewBtn = document.getElementById('preview-btn');
    const resultArea = document.getElementById('result-area');
    const tagBlock = document.getElementById('tag-block');
    const tagContent = document.getElementById('tag-content');

    previewBtn.onclick = ()=>{
        const inputText = document.getElementById('input-text').value.trim();
        if(!inputText){
            alert("请先粘贴文案内容");
            return;
        }
        const style = styleSelect.value;
        const hookLv = hookSlider.value;
        const lenType = document.querySelector('input[name="len"]:checked').value;
        // 生成模拟文案
        const outputText = generateMockText(inputText, style, hookLv, lenType);
        resultArea.textContent = outputText;

        // 动态估算Vlog朗读时长
        if(style === 'vlog'){
            const charCount = outputText.length;
            const sec = Math.round(charCount / 3); // 中文口语大约3字/秒
            const min = Math.floor(sec /60);
            const remainSec = sec % 60;
            timeEstimate.innerText = `约${min>0?min+"分":""}${remainSec}秒`;
        }

        tagBlock.style.display = "block";
        const tagDict = {
            xiaohongshu:"#小红书 #种草 #生活分享",
            dry:"#干货 #知识分享 #学习笔记",
            vlog:"#vlog #自媒体 #口播分享",
            vk:"#блог #контент #соцсети",
            ins:"#contentcreator #vlog #lifestyle"
        }
        tagContent.innerText = tagDict[style];
    }

    document.getElementById('clear-btn').onclick = ()=>{
        document.getElementById('input-text').value = "";
        resultArea.innerText = "预览结果将展示在这里";
        tagBlock.style.display = "none";
        document.getElementById('feedback-text').value = "";
    }
    document.getElementById('copy-btn').onclick = async ()=>{
        await navigator.clipboard.writeText(resultArea.innerText);
        alert("复制成功！");
    }
    document.getElementById('submit-feedback').onclick = ()=>{
        const fbText = document.getElementById('feedback-text').value.trim();
        if(!fbText){
            alert("请输入你的修改意见");
            return;
        }
        alert("✅ 反馈已记录（静态演示版，暂未持久化）");
    }
</script>
</body>
</html>
