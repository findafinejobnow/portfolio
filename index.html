<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨文化AIGC内容作品集</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
        body{background:#111827;color:#f3f4f6;padding:40px max(20px,calc(50vw - 600px))}
        h1{font-size:2.2rem;margin-bottom:12px}
        .desc{color:#9ca3af;margin-bottom:40px;max-width:700px;line-height:1.6}
        .card-wrap{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:24px}
        .card{background:#1f2937;padding:28px;border-radius:16px;border:1px solid #374151;transition:0.2s}
        .card:hover{transform:translateY(-4px);border-color:#60a5fa}
        .card h2{font-size:1.3rem;margin-bottom:10px}
        .card p{color:#d1d5db;line-height:1.6;margin-bottom:16px}
        .card a{display:inline-block;padding:10px 18px;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none}
    </style>
</head>
<body>
    <h1>Portfolio｜跨文化AI内容作品集</h1>
    <p class="desc">面向跨境自媒体、AIGC、对外汉语教学项目。技术栈：HTML/CSS/JS + Python Flask + Ollama本地大模型Qwen2.5。</p>

    <div class="card-wrap">
        <div class="card">
            <h2>文本风格预览小工具</h2>
            <p>AI社媒文案生成原型，支持小红书中文、VK俄语自媒体文案改写。前端完成，Flask+Ollama后端本地开发中。</p>
            <a href="./ai-text-preview/">进入项目</a>
        </div>
        <div class="card">
            <h2>中俄双语教案生成工具（待开发）</h2>
            <p>本地大模型辅助对外汉语备课，自动生成中俄双语教学脚本、课堂练习题。</p>
        </div>
    </div>
</body>
</html>
